name: Vérifier les archives multi-personnages
on:
  push:
    branches: [feature/archives-fch-multipersonnages]
  pull_request:
    paths:
      - 'character_archive.py'
      - 'viking_stats_page.py'
      - 'v2_core.py'
      - 'valheim_reader.py'
      - 'nordic_ui.py'
      - 'tests/test_character_archive.py'
permissions:
  contents: read
jobs:
  archive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler les sources concernées
        run: python3 -m py_compile character_archive.py viking_stats_page.py v2_core.py valheim_reader.py nordic_ui.py
      - name: Tests du moteur multi-personnages
        run: python3 -m unittest discover -s tests -p test_character_archive.py -v
      - name: Tous les tests autonomes du tracker
        run: python3 -m unittest discover -s tests -v
