name: Tester et publier Valheim Stats Tracker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: valheim-release
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Tkinter pour les tests de compatibilité
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
      - name: Tester le moteur, l'historique et l'updater
        run: python3 -m unittest discover -s tests -v
      - name: Vérifier les fichiers Python
        run: python3 -m py_compile app.py valheim_reader.py v2_core.py desktop_v2.py nordic_ui.py restored_pages.py real_assets.py windows_update.py windows_update_ui.py game_icon_extraction.py display_scaling.py collection_catalog.py collection_page.py wiki_images.py viking_stats.py viking_stats_page.py character_archive.py game_visuals.py tools/bundle_inventory_sprites.py tools/fetch_game_assets.py

  windows:
    runs-on: windows-latest
    needs: tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Qt et PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
      - name: Télécharger les véritables images officielles Valheim
        shell: pwsh
        run: |
          python -m tools.fetch_game_assets
      - name: Ajouter les sprites authentiques aux assets Windows
        shell: pwsh
        run: |
          python -m tools.bundle_inventory_sprites
          if ($LASTEXITCODE -ne 0) { throw 'Impossible de distribuer sans les sprites Valheim requis' }
          python -m unittest discover -s tests -p test_real_game_icons.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Couverture des icones Valheim incomplete' }
      - name: Vérifier la nouvelle interface Qt (hors écran)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -c "from PySide6.QtWidgets import QApplication; from nordic_ui import NordicWindow as TrackerWindow; from v2_core import TrackerStore; import tempfile; app=QApplication([]); tmp=tempfile.TemporaryDirectory(); w=TrackerWindow(store=TrackerStore(tmp.name)); assert w.stack.count()==12; assert w.NAV[10][0]=='Encyclopédie'; assert w.NAV[11][0]=='Statistiques du Viking'; assert w.collection_page.table.rowCount()>0; assert w.viking_stats_page.cards['trees'] is not None; assert w.NAV[0][0]=='Vue d’ensemble'; w.show(); app.processEvents(); assert w.hero.renderer.isValid(); assert not w.grab().isNull(); assert w.update_controller is not None; w.set_motion(False); assert not w.motion; w.close(); tmp.cleanup(); print('Interface Qt V2.4 : 12 pages et statistiques illustrees OK')"
      - name: Tester les interactions et les animations Qt
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m unittest discover -s tests -p test_v2_qt.py -v
      - name: Tester extraction Sprite et Texture2D sans fichiers du jeu
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_icon_extraction.py -v
      - name: Valider une vraie image Greyling via le MediaWiki communautaire
        shell: pwsh
        run: |
          python -c 'from tempfile import TemporaryDirectory; from pathlib import Path; from wiki_images import WikiImageCache; temp=TemporaryDirectory(); client=WikiImageCache(Path(temp.name)/"wiki_cache"); image=client.fetch("$enemy_greyling"); print("Greyling image:", image, "source:", client.source("$enemy_greyling")); assert image and image.is_file(), "Le wiki Valheim ne fournit pas de photo verifiee pour Greyling via les API selectionnees"; temp.cleanup()'
          if ($LASTEXITCODE -ne 0) { throw 'Le fallback wiki reel doit fonctionner avant publication.' }
      - name: Construire l'application Windows autonome
        shell: pwsh
        run: |
          # UnityPy utilise fmod_toolkit, dont la DLL native n'est pas embarquee par --collect-all UnityPy.
          # Verifier explicitement la dependance a la construction avant de produire le ZIP.
          $fmodDll = & python -c 'from pathlib import Path; from importlib.util import find_spec; spec=find_spec("fmod_toolkit"); assert spec and spec.submodule_search_locations, "fmod_toolkit non installe"; path=Path(next(iter(spec.submodule_search_locations)))/"libfmod"/"Windows"/"x64"/"fmod.dll"; assert path.is_file(), f"DLL FMOD absente du package : {path}"; print(path)'
          if ($LASTEXITCODE -ne 0) { throw 'Dependance FMOD absente avant construction.' }
          # Le decodeur charge archspec/json/cpu/microarchitectures.json a la premiere lecture de sprite.
          $archspecCpu = & python -c 'from pathlib import Path; from importlib.util import find_spec; s=find_spec("archspec"); assert s and s.submodule_search_locations, "archspec introuvable"; p=Path(next(iter(s.submodule_search_locations)))/"json"/"cpu"; assert (p/"microarchitectures.json").is_file(), f"Ressources archspec absentes : {p}"; print(p)'
          if ($LASTEXITCODE -ne 0) { throw 'Ressources JSON archspec introuvables avant construction.' }
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ValheimStatsTracker --add-data 'fr_names.json;.' --add-data 'assets;assets' --hidden-import localization_fr --collect-all UnityPy --collect-all fmod_toolkit --add-binary "$fmodDll;fmod_toolkit/libfmod/Windows/x64" --collect-all archspec --add-data "$archspecCpu;archspec/json/cpu" --hidden-import PySide6.QtSvg nordic_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Construction PyInstaller echouee.' }
          $bundledFmod = 'dist/ValheimStatsTracker/_internal/fmod_toolkit/libfmod/Windows/x64/fmod.dll'
          if (-not (Test-Path -LiteralPath $bundledFmod -PathType Leaf)) {
            throw "fmod.dll absente de l'application construite : $bundledFmod"
          }
          Write-Host "FMOD native presente dans le bundle Windows : $bundledFmod"
          $bundledArchspec = 'dist/ValheimStatsTracker/_internal/archspec/json/cpu/microarchitectures.json'
          if (-not (Test-Path -LiteralPath $bundledArchspec -PathType Leaf)) {
            throw "Base JSON archspec absente du programme construit : $bundledArchspec"
          }
          Write-Host "Archspec JSON present dans le bundle Windows : $bundledArchspec"
          $version = (Get-Content version.json | ConvertFrom-Json).version
          $archive = "dist/Valheim_Stats_Tracker_v${version}_Windows.zip"
          Compress-Archive -Path dist/ValheimStatsTracker -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) { throw "ZIP Windows introuvable" }
          Write-Host "Archive Windows : $archive"
      - name: Tester UnityPy FMOD et archspec JSON dans l'exécutable compilé
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/ValheimStatsTracker/ValheimStatsTracker.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--verify-unitypy-bundle' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "UnityPy/resources absent du programme Windows (code $($process.ExitCode))" }
          Write-Host 'Extraction : UnityPy + FMOD + archspec JSON lisibles depuis l executable compile'
      - name: Tester l'extracteur dans l'exécutable Windows assemblé
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/ValheimStatsTracker/ValheimStatsTracker.exe'
          $check = Start-Process -FilePath $exe -ArgumentList '--verify-icon-extractor' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Le test d'extraction Sprite/Texture2D compilé a échoué : $($check.ExitCode)" }
          Write-Host "Extraction UnityPy / Pillow depuis EXE : OK"
      - name: Tester le cache Wiki et Pillow depuis le vrai programme Windows compilé
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/ValheimStatsTracker/ValheimStatsTracker.exe'
          $test = Start-Process -FilePath $exe -ArgumentList '--verify-wiki-cache' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Cache Wiki ou Pillow indisponible depuis l'EXE : $($test.ExitCode)" }
          Write-Host 'Import Wiki et Pillow depuis EXE : OK'
      - name: Tester le contrôle du ZIP depuis le véritable EXE compilé
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/ValheimStatsTracker/ValheimStatsTracker.exe'
          $check = Start-Process -FilePath $exe -ArgumentList '--verify-safe-updater' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Le vérificateur ZIP compilé a échoué : $($check.ExitCode)" }
          Write-Host 'Validation ZIP incluse dans le programme : OK'

      - name: Vérifier l'updater sans processus caché
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_windows_update_safe.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Le téléchargement SHA-256 et la préparation manuelle ont échoué.' }
          $source = Get-Content -Raw windows_update.py
          if ($source -match 'ExecutionPolicy|subprocess\\.Popen|INSTALL_PS1|install\\.ps1') {
            throw 'Un ancien mécanisme silencieux reste présent dans windows_update.py.'
          }
          Write-Host 'Mise à jour vérifiée et installée manuellement : aucune exécution PowerShell.'

      - name: Contrôler chaque sprite Valheim depuis le véritable EXE compilé
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path 'dist/ValheimStatsTracker/ValheimStatsTracker.exe').Path
          $check = Start-Process -FilePath $exe -ArgumentList '--verify-real-icons' -Wait -PassThru
          if ($check.ExitCode -ne 0) {
            throw "Sprites du jeu absents du programme compilé (sortie : $($check.ExitCode))."
          }
          Write-Host 'Vraies icônes Valheim dans le programme compilé : OK'

      - name: Vérifier Defender sur l'exécutable si le service est actif
        shell: pwsh
        run: |
          $defender = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($defender -and $defender.AntivirusEnabled -and $defender.AMServiceEnabled) {
            $exe = (Resolve-Path 'dist/ValheimStatsTracker/ValheimStatsTracker.exe').Path
            $scanStart = Get-Date
            Start-MpScan -ScanType CustomScan -ScanPath $exe -ErrorAction Stop
            $zip = (Get-ChildItem -Path dist -Filter '*_Windows.zip' | Select-Object -First 1).FullName
            if (-not $zip) { throw 'Archive Windows ZIP absente.' }
            Start-MpScan -ScanType CustomScan -ScanPath $zip -ErrorAction Stop
            if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
              throw 'Defender a retire le ZIP du dossier.'
            }
            $recent = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              $_.InitialDetectionTime -ge $scanStart.AddMinutes(-1)
            })
            if ($recent.Count -gt 0) {
              $ids = ($recent | ForEach-Object { $_.ThreatID }) -join ','
              throw ("Defender signale une detection recente lors du controle: " + $ids)
            }
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw 'Windows Defender a supprimé ou placé en quarantaine le programme.'
            }
            Write-Host 'Analyse Defender exécutée sur le programme Windows compilé.'
          } else {
            Write-Warning 'Defender indisponible sur ce runner : validation antivirus non garantie.'
          }

      - name: Transmettre l'archive Windows à la publication
        uses: actions/upload-artifact@v4
        with:
          name: valheim-windows
          path: dist/*_Windows.zip
          if-no-files-found: error
          retention-days: 7

  release:
    # Autorisation strictement bornee a la V2.5.1 :
    # - variable GitHub sur cette version ; ou
    # - marqueur d'approbation explicite dans le commit de fusion de la PR,
    #   autorise par le proprietaire du projet. Aucun push ordinaire ne publie.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.VALHEIM_WINDOWS_APPROVED_VERSION == '2.5.1' || contains(github.event.head_commit.message, '[approve-v2.5.1-release]'))
    needs: [tests, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Récupérer le ZIP Windows autonome
        uses: actions/download-artifact@v4
        with:
          name: valheim-windows
          path: dist/windows
      - name: Publier les ZIP Windows et historique + manifeste compatible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("version.json", encoding="utf8"))["version"])')
          TAG="v$VERSION"
          mkdir -p dist
          cp dist/windows/*_Windows.zip dist/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p update.json -D dist
            gh release upload "$TAG" dist/*_Windows.zip --clobber
          else
            python3 tools/build_release.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" --output dist
            gh release create "$TAG" dist/*.zip dist/update.json --target "$GITHUB_SHA" --title "Valheim Stats Tracker $TAG" --notes-file RELEASE_NOTES.md --latest
          fi
          cp dist/update.json update.json
          git add -f update.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Manifeste pour $TAG [skip ci]"
            git push origin HEAD:main
          fi
