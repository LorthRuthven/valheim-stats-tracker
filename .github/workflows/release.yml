name: Tester et publier Valheim Stats Tracker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: valheim-release
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Tkinter pour les tests de compatibilité
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
      - name: Tester le moteur, l'historique et l'updater
        run: python3 -m unittest discover -s tests -v
      - name: Vérifier les fichiers Python
        run: python3 -m py_compile app.py valheim_reader.py v2_core.py desktop_v2.py nordic_ui.py restored_pages.py real_assets.py windows_update.py windows_update_ui.py game_icon_extraction.py tools/fetch_game_assets.py

  windows:
    runs-on: windows-latest
    needs: tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Qt et PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
      - name: Télécharger les véritables images officielles Valheim
        shell: pwsh
        run: |
          python -m tools.fetch_game_assets
      - name: Vérifier la nouvelle interface Qt (hors écran)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -c "from PySide6.QtWidgets import QApplication; from nordic_ui import NordicWindow as TrackerWindow; from v2_core import TrackerStore; import tempfile; app=QApplication([]); tmp=tempfile.TemporaryDirectory(); w=TrackerWindow(store=TrackerStore(tmp.name)); assert w.stack.count()==10; assert w.NAV[0][0]=='Vue d’ensemble'; w.show(); app.processEvents(); assert w.hero.renderer.isValid(); assert not w.grab().isNull(); assert w.update_controller is not None; w.set_motion(False); assert not w.motion; w.close(); tmp.cleanup(); print('Interface Qt V2.1 et illustrations : OK')"
      - name: Tester les interactions et les animations Qt
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m unittest discover -s tests -p test_v2_qt.py -v
      - name: Construire l'application Windows autonome
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ValheimStatsTracker --add-data 'fr_names.json;.' --add-data 'assets;assets' --hidden-import localization_fr --collect-all UnityPy --hidden-import PySide6.QtSvg nordic_ui.py
          $version = (Get-Content version.json | ConvertFrom-Json).version
          $archive = "dist/Valheim_Stats_Tracker_v${version}_Windows.zip"
          Compress-Archive -Path dist/ValheimStatsTracker -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) { throw "ZIP Windows introuvable" }
          Write-Host "Archive Windows : $archive"
      - name: Tester UnityPy.resources dans l'exécutable compilé
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/ValheimStatsTracker/ValheimStatsTracker.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--verify-unitypy-bundle' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "UnityPy/resources absent du programme Windows (code $($process.ExitCode))" }
          Write-Host 'Extraction : ressources UnityPy embarquées et importées dans le programme compilé'
      - name: Transmettre l'archive Windows à la publication
        uses: actions/upload-artifact@v4
        with:
          name: valheim-windows
          path: dist/*_Windows.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [tests, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Récupérer le ZIP Windows autonome
        uses: actions/download-artifact@v4
        with:
          name: valheim-windows
          path: dist/windows
      - name: Publier les ZIP Windows et historique + manifeste compatible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("version.json", encoding="utf8"))["version"])')
          TAG="v$VERSION"
          mkdir -p dist
          cp dist/windows/*_Windows.zip dist/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p update.json -D dist
            gh release upload "$TAG" dist/*_Windows.zip --clobber
          else
            python3 tools/build_release.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" --output dist
            gh release create "$TAG" dist/*.zip dist/update.json --target "$GITHUB_SHA" --title "Valheim Stats Tracker $TAG" --notes-file RELEASE_NOTES.md --latest
          fi
          cp dist/update.json update.json
          git add -f update.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Manifeste pour $TAG [skip ci]"
            git push origin HEAD:main
          fi
